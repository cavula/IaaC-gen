# Runs scripts/ci.sh on every push and pull request.
# Actions are pinned to full commit hashes (supply chain, OWASP LLM03 and SCF TPM controls).
# Tags and hashes checked against github.com on 2026-10-23.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install pinned dependencies and tools (hash verified)
        run: python -m pip install --require-hashes --no-deps -r requirements.txt -r requirements-dev.txt

      - name: Run all checks
        run: ./scripts/ci.sh

      - name: Keep the SBOM
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: build/sbom.cdx.json
          retention-days: 30
